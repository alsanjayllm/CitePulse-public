# Curated OpenRouter model list -- mirrors config/model_catalog.yaml's
# shape (used by citepulse.model_recommender.list_openrouter_models()),
# but with context_length instead of approx_ram_gb: no RAM concept
# applies to a cloud model, and there's no "installed" concept either --
# every entry here is equally available given a valid OpenRouter API key.
#
# Entries are grouped into three fixed buckets for the Compare Models
# picker and the free-model rotation pool (see
# citepulse.ai_engines.provider._rotate_free_model), curated for
# CitePulse's own AEO/AI-readability workload (narrative generation,
# classification calls like recommendation_rate/message_accuracy, the
# task-readiness agent loop):
#   - free:    zero-cost OpenRouter models, good enough for CitePulse's
#              classification/narrative calls. NOTE: free-tier endpoints
#              share a small capacity pool and are rate-limited upstream
#              after only a handful of burst calls (no Retry-After header
#              is sent). CitePulse therefore rotates across ALL entries in
#              this bucket (round-robin, paced) when a free model is
#              selected, so a run's many back-to-back LLM calls spread
#              across the pool instead of exhausting one shared free pool.
#   - popular: well-known, high-quality general models
#   - cheap:   low $/token, fast -- suited to CitePulse's bulk per-probe
#              classifier calls
#
# `cost_per_1m_tokens` and `popularity_rank` are a manually maintained,
# point-in-time snapshot -- like model_catalog.yaml's approx_ram_gb, this
# is NOT read from a live OpenRouter pricing/rankings API (no such
# integration exists in CitePulse) and will drift from OpenRouter's
# actual live numbers over time; update by hand when it goes stale.
# Free-tier model ids on OpenRouter also change over time -- re-verify
# the `:free` entries still exist/are still free periodically.
#
# `name` is CitePulse's own dispatch-prefixed model string (see
# citepulse.ai_engines.provider._split_model) -- "openrouter:" followed
# by OpenRouter's own model id, exactly as OpenRouter's API expects it
# once the prefix is stripped.
#
# Last verified: 2026-09-03 (each free entry actually served a 200 via
# the public API)

# -- free (rotation pool) ---------------------------------------------------
# Entries verified working on 2026-09-03; the whole bucket is the free
# rotation pool, so more (working) entries = more headroom before the
